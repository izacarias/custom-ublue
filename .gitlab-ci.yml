stages:
  - build_push

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_DEPTH: 1

build_push:
  stage: build_push
  interruptible: true
  rules:
    # Merge request pipelines only build the image, they never push it,
    # mirroring the `pull_request` guard in the GitHub Actions workflow.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        PUSH_IMAGE: "false"
    # Pushes to the default branch, scheduled pipelines and manual "Run
    # pipeline" runs build AND push, matching the GitHub `push`/`schedule`/
    # `workflow_dispatch` triggers.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      variables:
        PUSH_IMAGE: "true"
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      variables:
        PUSH_IMAGE: "true"
    - if: '$CI_PIPELINE_SOURCE == "web"'
      variables:
        PUSH_IMAGE: "true"
  script:
    - set -euo pipefail
    - echo "Pipeline source ${CI_PIPELINE_SOURCE}, push image = ${PUSH_IMAGE:-false}"

    # The runner only ships Docker, but the Justfile build/rechunk recipes
    # shell out to podman-only features (e.g. `--mount=type=image` for
    # chunkah), so podman is installed here instead of reusing Docker.
    - apt-get update
    - apt-get install -y --no-install-recommends podman jq
    - mkdir -p ~/bin && curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to ~/bin
    - export PATH=$PATH:$HOME/bin && echo "Podman version:" $(podman --version)